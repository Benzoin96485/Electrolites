[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolites"
version = "0.1.0"
description = "Drop-in GPU kernel replacements for GPU4PySCF: exchange, Coulomb, XC, VV10 and the analytic gradient"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Weiliang Luo" }]
keywords = ["quantum chemistry", "GPU", "CUDA", "DFT", "GPU4PySCF"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
# gpu4pyscf itself is deliberately not pinned here: it ships as
# gpu4pyscf-cuda11x / gpu4pyscf-cuda12x and the CUDA flavour is the user's
# choice.  Tested against 1.7.0 and 1.8.1; electrolites.check_targets()
# reports at run time whether the entry points it patches are present.
dependencies = ["numpy", "pyscf>=2.8"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Benzoin96485/Electrolites"

[tool.setuptools]
# the CUDA sources, launch tables and Rys tables are package data: a wheel
# carries them, so nothing depends on where the repository was checked out.
# The three *written* kernel families are the exception -- electrolites.codegen
# emits them from the angular-momentum class in 0.7 s and electrolites._gen
# caches the result, so the generator ships and its 13 MB of output does not.
include-package-data = true

[tool.setuptools.packages.find]
include = ["electrolites*"]

[tool.setuptools.package-data]
electrolites = [
  "kernels/*.cu",
  "kernels/*.json",
  "kernels/data/*.npz",
  "kernels/cuda/**/*.cu",
  "kernels/cuda/**/*.cuh",
  "kernels/cuda/**/*.json",
]
